<head>

<title>FRPRD Earned Media Wall</title>
<style>
  :root {
    --bg: #0f172a;
    --bg2: #1e293b;
    --card: #ffffff;

    --muted: #64748b;
    --press: #2563eb;
    --oped: #7c3aed;
    --editorial: #0891b2;
    --letter: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e2e8f0;
    background: radial-gradient(1200px 600px at 20% -10%, #1e293b, var(--bg));
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 8px;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    margin: 0;
    font-size: 1.9rem;
    letter-spacing: -0.02em;
    font-weight: 800;
  }
  .sub { color: #94a3b8; margin-top: 6px; font-size: .95rem; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 32px; max-width: 1400px; margin: 0 auto;
  }
  .group { display: flex; gap: 6px; align-items: center; }
  .group .lbl { color: #94a3b8; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
  button.chip {
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.04);
    color: #cbd5e1;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-size: .82rem; transition: all .15s ease;
  }
  button.chip:hover { background: rgba(255,255,255,.12); }
  button.chip.active { background: #fff; color: #0f172a; border-color: #fff; font-weight: 600; }
  .spacer { flex: 1; }
  .hint { color: #64748b; font-size: .78rem; }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    grid-auto-rows: 116px;
    grid-auto-flow: dense;
    gap: 14px;
    padding: 12px 32px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    position: relative;
    background: var(--card);
    color: var(--ink);
    border-radius: 16px;
    padding: 16px 16px 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    border-left: 4px solid var(--accent, var(--press));
    transition: transform .16s ease, box-shadow .16s ease;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(0,0,0,.4); z-index: 5; }
  .card .outlet {
    font-size: .68rem; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--accent, var(--press));
    display: flex; align-items: center; gap: 6px;
  }
  .card .lock { font-size: .72rem; color: var(--muted); }
  .card .headline {
    margin-top: 8px; font-weight: 650; line-height: 1.24; color: #0f172a;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .badge {
    margin-top: auto; font-size: .68rem; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .card .badge .reach { font-weight: 700; color: #334155; }
  .card .badge .surge { font-weight: 800; color: var(--accent, var(--press)); }

  /* size tiers */
  .t-featured { grid-column: span 2; grid-row: span 2; }
  .t-large    { grid-column: span 2; grid-row: span 1; }
  .t-medium   { grid-column: span 1; grid-row: span 2; }
  .t-small    { grid-column: span 1; grid-row: span 1; }
  .t-featured .headline { font-size: 1.28rem; -webkit-line-clamp: 4; }
  .t-large    .headline { font-size: 1.02rem; -webkit-line-clamp: 3; }
  .t-medium   .headline { font-size: .96rem; -webkit-line-clamp: 5; }
  .t-small    .headline { font-size: .9rem; -webkit-line-clamp: 3; }

  /* hover reveal panel */
  .reveal {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #ffffff 26%);
    padding: 26px 16px 14px;
    transform: translateY(100%); opacity: 0;
    transition: transform .18s ease, opacity .18s ease;
  }
  .card:hover .reveal { transform: translateY(0); opacity: 1; }
  .reveal .date { font-size: .72rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .reveal .summary {
    font-size: .8rem; color: #334155; line-height: 1.35; margin-bottom: 10px;
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; -webkit-line-clamp: 3;
  }
  .t-small .reveal .summary, .t-large .reveal .summary { -webkit-line-clamp: 2; }
  .read {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent, var(--press)); color: #fff;
    text-decoration: none; font-size: .8rem; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; transition: filter .15s ease;
  }
  .read:hover { filter: brightness(1.08); }
  .read.disabled { background: #cbd5e1; color: #64748b; pointer-events: none; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: #94a3b8; font-size: .78rem; }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; }
  .empty { color: #94a3b8; padding: 40px 32px; }
</style>

    const summary = r.summary ? `<div class="summary">${esc(r.summary)}</div>` : "";
    const surgeNote = r.momentum > 1 ? ` &middot; ${r.momentum} total hits in tracker` : "";
    const date = r.date ? `<div class="date">${esc(r.date)}${r.market ? " &middot; " + esc(r.market) : ""}${surgeNote}</div>` : "";
    const btn = (r.link && r.link.startsWith("http"))
      ? `<a class="read" href="${esc(r.link)}" target="_blank" rel="noopener">Read article &rarr;</a>`
      : `<span class="read disabled">No link</span>`;
    return `
      <article class="card ${tier}" style="--accent:${accent}" data-label="${esc(r.label)}">
        <div class="outlet">${esc(r.outlet)} ${lock}</div>
        <div class="headline">${esc(r.headline)}</div>
        <div class="badge">${badge}</div>
        <div class="reveal">
          ${date}
          ${summary}
          ${btn}
        </div>
      </article>`;
  }

  function currentRecords() {
    let recs = DATA.slice();
    if (filterMode !== "all") recs = recs.filter(r => r.label === filterMode);
    if (sortMode === "reach") recs.sort((a, b) => b.reach - a.reach);
    else if (sortMode === "date") recs.sort((a, b) => (b.dateIso || "").localeCompare(a.dateIso || ""));
    else if (sortMode === "outlet") recs.sort((a, b) => a.outlet.localeCompare(b.outlet));
    else if (sortMode === "momentum") recs.sort((a, b) =>
      (b.momentum - a.momentum) || (b.dateIso || "").localeCompare(a.dateIso || "") || (b.reach - a.reach));
    return recs;
  }

  function render() {
    const recs = currentRecords();
    if (!recs.length) {
      wall.innerHTML = '<div class="empty">No stories match this filter.</div>';
      return;
    }
    wall.innerHTML = recs.map(cardHtml).join("");
    document.getElementById("count").textContent = recs.length;
  }

  document.querySelectorAll("[data-sort]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-sort]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      sortMode = btn.dataset.sort;
      render();
    });
  });
  document.querySelectorAll("[data-size]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-size]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      sizeMode = btn.dataset.size;
      sizeHint.textContent = HINTS[sizeMode];
      render();
    });
  });
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("[data-filter]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filterMode = btn.dataset.filter;
      render();
    });
  });

  render();
</script>
</body>
</html>
