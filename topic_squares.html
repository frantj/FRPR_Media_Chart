const COLORS        = {"CoCo Naming": "#2563eb", "BNSF Agreement": "#7c3aed", "Station Locations": "#0891b2", "City Council": "#059669", "Community Outreach": "#d97706", "Op-Eds & Editorials": "#dc2626", "RTD / Partners": "#9333ea", "General Coverage": "#64748b"};
const TOTAL_MASTER  = 333;

// Treemap: binary-split, fills rect exactly with no gaps
const GAP = 5;
const TM_SIZE = 660;

function treemap(items, x, y, w, h) {
  if (!items.length) return [];
  if (items.length === 1) return [{ ...items[0], x, y, w, h }];
  const total = items.reduce((s, i) => s + i.masterCount, 0);
  // Split: find where first half of value fits
  let cumul = 0, splitAt = 0;
  const half = total / 2;
  for (let i = 0; i < items.length - 1; i++) {
    cumul += items[i].masterCount;
    if (cumul >= half) { splitAt = i + 1; break; }
  }
  if (!splitAt) splitAt = 1;
  const a = items.slice(0, splitAt);
  const b = items.slice(splitAt);
  const aShare = a.reduce((s, i) => s + i.masterCount, 0) / total;
  if (w >= h) {
    const aw = Math.round((w - GAP) * aShare);
    const bw = w - GAP - aw;
    return [
      ...treemap(a, x,        y, aw, h),
      ...treemap(b, x+aw+GAP, y, bw, h),
    ];
  } else {
    const ah = Math.round((h - GAP) * aShare);
    const bh = h - GAP - ah;
    return [
      ...treemap(a, x, y,        w, ah),
      ...treemap(b, x, y+ah+GAP, w, bh),
    ];
  }
}

function buildChart() {
  chartEl.innerHTML = "";
  legendEl.innerHTML = "";
  const rects = treemap(GROUPS, 0, 0, TM_SIZE, TM_SIZE);
  rects.forEach((r, i) => {
    const g     = r; // same object
    const color = COLORS[g.topic] || "#414da0";
    const sq    = document.createElement("div");
    sq.className = "square";
    sq.style.left   = r.x + "px";
    sq.style.top    = r.y + "px";
    sq.style.width  = r.w + "px";
    sq.style.height = r.h + "px";
    sq.innerHTML = `
      <div class="bg" style="background:${color}"></div>
      <div class="topic-name">${esc(g.topic)}</div>
    `;
    sq.addEventListener("click", () => openSidebar(g, sq));
    chartEl.appendChild(sq);

    const li = document.createElement("div");
    li.className = "legend-item";
    li.innerHTML = `<div class="legend-dot" style="background:${color}"></div>${esc(g.topic)} (${g.masterCount})`;
    legendEl.appendChild(li);
  });
}

function esc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}


const chartEl  = document.getElementById("chart");
const legendEl  = document.getElementById("legend");
const sidebar   = document.getElementById("sidebar");
const sbInner   = document.getElementById("sbInner");

function sidebarHtml(g) {
  const color = COLORS[g.topic] || "#414da0";
  const arts = g.articles.length
    ? g.articles.map(a => {
        const headline = a.link
          ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.headline)}</a>`
          : esc(a.headline);
        const reach = a.reach > 0 ? ` &middot; ${(a.reach/1e6).toFixed(1)}M reach` : "";
        return `<div class="sb-article">
          <div class="sb-headline">${headline}</div>
          <div class="sb-meta">${esc(a.outlet)} &middot; ${esc(a.date)}${reach}</div>
        </div>`;
      }).join("")
    : `<div class="sb-meta" style="padding-top:8px">No curated articles for this topic.</div>`;
  return `<div class="sb-topic" style="color:${color}">${esc(g.topic)}</div>
    ${arts}`;
}

let activeSquare = null;
function openSidebar(g, sq) {
  sbInner.innerHTML = sidebarHtml(g);
  if (activeSquare) activeSquare.classList.remove("active");
  activeSquare = sq;
  sq.classList.add("active");
}

buildChart();
// Open first group by default
if (GROUPS.length) {
  const firstSq = chartEl.querySelector(".square");
  openSidebar(GROUPS[0], firstSq);
}
</script>
